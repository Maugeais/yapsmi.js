<link rel="stylesheet" href="../../controls/formula-v1.1.plugin/css/formula.css" />

<div class="plugin_title">formula</div>

<div id="formula_tabs">

    <div class="formula_tab" id="formula_1">
        <select>
            <option value = "none">None</option>
        </select>


        <div class="formula_textarea">
            <textarea autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             id="formula_formula_1" cols="40" rows="5">
                let tt=t/10000;
                let x = tt*3500;
                return(x)
            </textarea>
        </div>

        <div class="formula_duration">
            <label for = "formula_duration_1">Duration (s) T=</label>
            <input type="text" id="formula_duration_1" value="10000"/>
        </div>

        <div class="formula_step">
            <label for = "formula_step_1">Time step(s) dt=</label>
            <input type="text" id="formula_step_1"  value="100"/>
        </div>

        <button onclick="exec_formula(1)">Exec</button>
        <button onclick="stop_formula(1)">Stop</button>
    </div>
