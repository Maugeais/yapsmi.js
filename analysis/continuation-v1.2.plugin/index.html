<link rel="stylesheet" href="../../analysis/continuation-v1.2.plugin/css/continuation.css" />

<div class="plugin_title">continuation</div>


<div id="continuation_display"></div>

<div id="continuation_controls">
    <div class = "control_knob continuation_tail">
        <div class="value_container">History=<div class="knob_value" id="continuation_tail_value">36s</div></div>
        <div class="knob" id="continuation_tail"></div>
    </div>

    <br>

    <div id="continuation_parameters">

        <label for="continuation_x">x:</label>

        <select class="select" id="continuation_x" onchange="continuation_change_axis('x', this)">

            <option value="time" selected>time</option>
            <option value="rms">rms</option>
            <option value="frequency">frequency</option>
            <option value="amplitude">amplitude</option>

        </select>
        <br>

        <label for="continuation_y">y:</label>

        <select id="continuation_y" onchange="continuation_change_axis('y', this)">

            <option value="rms" selected>rms</option>
            <option value="frequency">frequency</option>
            <option value="amplitude">amplitude</option>

        </select>

    </div>
    <br>

    <fieldset><legend>Channel</legend>
        <input type="radio" name="continuation_channel" checked onclick="change_continuation_channel('0')"><label>0</label></input>
        <input type="radio" name="continuation_channel" onclick="change_continuation_channel('1')"><label >1</label></input>
        <input type="radio" name="continuation_channel" onclick="change_continuation_channel('0+1')"><label >0+1</label></input>
    </fieldset>

    
    <br>

    <fieldset><legend>Scale</legend>
        <input type="checkbox" onchange="change_axis_scale($(this).is(':checked'), 'x')"><label>x-log</label></input>
        <input type="checkbox" onchange="change_axis_scale($(this).is(':checked'), 'y')"><label >y-log</label></input>
    </fieldset>

</div>
