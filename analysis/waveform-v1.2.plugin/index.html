<link rel="stylesheet" href="../../analysis/waveform-v1.2.plugin/css/waveform.css" />

<div class="plugin_title">Waveform</div>

 <!-- <canvas class="waveform_canvas" id="waveform_canvas{{id}}"></canvas> -->

 <div id="waveform_display{{id}}"></div>

<div class="waveform_controls" id="waveform_controls{{id}}">
        
</div>

<fieldset id="waveform_source"><legend>Source</legend>
    <input type="radio" name="waveform_sources" value="channel_0" checked=""><label for="channel_0">0</label><br>
    <input type="radio" name="waveform_sources" value="channel_1"><label for="channel_1">1</label><br>
    <input type="radio" name="waveform_sources" value="channel_0+1"><label for="channel_0+1">0+1</label><br>
    <input type="radio" name="waveform_sources" value="channel_0/1"><label for="channel_0/1">0/1</label><br>
</fieldset>


<fieldset class="waveform_ranges"><legend>Range x</legend>
    <label for="x_min">min</label><input type="text" id="waveform_xmin" value="" checked=""><br>
    <label for="x_max">max</label><input type="text" id="waveform_xmax" value="" checked=""><br>
</fieldset>

<fieldset id="waveform_range_y" class="waveform_ranges"><legend>Range y</legend>
    <label for="y_min">min</label><input type="text" id="waveform_ymin" value="" checked=""><br>
    <label for="y_min">max</label> <input type="text" id="waveform_ymax" value="" checked=""><br>
</fieldset>
