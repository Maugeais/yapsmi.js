<link rel="stylesheet" href="../../tools/parameters_range-v1.1.tool/css/parameters_range.css" />


	<div onclick="$(this).parent().hide()" class="close_button"></div>
	<div class="plugin_title" id="parameters_handle">Parameters setting</div>
	<table id="parameters_table">
		 <thead>
			  <tr>
				   <th style="width:15%" title="Control name"> Control</th>
				   <th style="width:15%" title="Database of possible values"> Database</th>
				   <th style="width:15%" title="Current value of the knob"> Current </th>
				   <th style="width:15%" title="Minimum value of the knob"> Min </th>
				   <th style="width:15%" title="Maximum value of teh knob"> Max </th>
				   <th style="width:6%" title="Is the knob in a logarithmic scale?"> Log </th>		
				   <th style="width:15%"> </th>
			  </tr>
		 </thead>

		 <tbody>

		 </tbody>
	  
	 
	</table> 

	<button onclick="parameters_from_range();">Apply</button>	
	<button onclick="parameters_to_range();">Reload</button>

	<div id="waiting_db"></div>

	<div class="help_button" onclick="$('#model').toggle(); console.log('test'); " title="Details on the different parameters can be found in the model page"> test</div>
